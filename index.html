<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>醍醐骑行 · 花见之路</title>
<meta name="description" content="醍醐骑自行车穿过黄昏的樱花大道 —— 一个 Three.js 小场景">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --ink:#3a3148;
    --paper:#f6efe4;
    --seal:#b5484d;
    --gold:#ffc53d;
    --petal:#f7b9c9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#2e3a67;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block}
  #stage{position:fixed;inset:0}

  /* ---------- 短册题签（縦书） ---------- */
  .tanzaku{
    position:fixed;top:28px;left:28px;z-index:10;
    writing-mode:vertical-rl;
    background:
      repeating-linear-gradient(0deg,rgba(58,49,72,.028) 0 1px,transparent 1px 5px),
      linear-gradient(180deg,#faf5ec,#f1e8d8);
    border:1px solid rgba(58,49,72,.16);
    border-radius:3px;
    box-shadow:0 10px 30px rgba(30,20,50,.35),0 2px 6px rgba(30,20,50,.25);
    padding:22px 14px 16px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    user-select:none;
  }
  .tanzaku-main{
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    font-weight:900;font-size:30px;letter-spacing:.34em;color:var(--ink);
  }
  .tanzaku-sub{
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    font-weight:600;font-size:12px;letter-spacing:.5em;color:rgba(58,49,72,.62);
    border-top:1px solid rgba(58,49,72,.22);padding-top:10px;
  }
  .seal{
    writing-mode:horizontal-tb;
    width:30px;height:30px;border-radius:5px;
    background:var(--seal);color:#fdf6ee;
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1.5px rgba(253,246,238,.55),0 1px 3px rgba(30,20,50,.3);
    margin-top:2px;
  }

  /* ---------- 右上提示 ---------- */
  .hints{
    position:fixed;top:30px;right:30px;z-index:10;
    color:rgba(253,246,238,.92);font-size:12px;letter-spacing:.08em;
    background:rgba(43,36,64,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(253,246,238,.14);
    padding:10px 14px;border-radius:99px;
    user-select:none;
  }
  .hints b{color:var(--gold);font-weight:600}

  /* ---------- 底部操控台 ---------- */
  .dock{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:10px;
    background:rgba(43,36,64,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(253,246,238,.15);
    border-radius:99px;padding:10px 14px;
    box-shadow:0 12px 40px rgba(20,12,40,.45);
  }
  .dock .speedbox{display:flex;align-items:center;gap:10px;padding:0 6px}
  .dock label{color:rgba(253,246,238,.85);font-size:12px;letter-spacing:.12em;user-select:none;white-space:nowrap}
  .dock output{color:var(--gold);font-size:12px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums;user-select:none}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--seal) var(--fill,47%),rgba(253,246,238,.22) var(--fill,47%));
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--paper);border:2px solid var(--seal);
    box-shadow:0 2px 6px rgba(20,12,40,.5);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--paper);
    border:2px solid var(--seal);box-shadow:0 2px 6px rgba(20,12,40,.5);cursor:grab;
  }
  input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(255,197,61,.55)}
  .dock .divider{width:1px;height:22px;background:rgba(253,246,238,.16)}
  .btn{
    appearance:none;border:1px solid rgba(253,246,238,.22);cursor:pointer;
    background:rgba(253,246,238,.08);color:#fdf6ee;
    font-family:inherit;font-size:12.5px;letter-spacing:.14em;
    padding:9px 16px;border-radius:99px;
    transition:background .18s,transform .12s,border-color .18s;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(253,246,238,.18);border-color:rgba(253,246,238,.4)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.bell.pinged{animation:ping .45s ease}
  @keyframes ping{40%{transform:scale(1.12);background:rgba(255,197,61,.35);border-color:var(--gold)}}

  /* ---------- 启程幕布 ---------- */
  .veil{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:#f6efe4;
    transition:opacity .8s ease;pointer-events:none;
  }
  .veil.off{opacity:0}
  .veil .mark{
    width:64px;height:64px;border-radius:12px;background:var(--seal);
    color:#fdf6ee;font-family:"Noto Serif SC",serif;font-weight:900;font-size:34px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2.5px rgba(253,246,238,.55);
    animation:breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe{50%{transform:scale(1.07)}}
  .veil p{color:var(--ink);letter-spacing:.5em;font-size:13px;text-indent:.5em}
  .veil small{color:rgba(58,49,72,.55);letter-spacing:.2em;font-size:11px}

  .nogl{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:#2e3a67;color:#fdf6ee;letter-spacing:.2em;font-size:14px;text-align:center;line-height:2;
  }

  @media (max-width:640px){
    .tanzaku{top:16px;left:16px;padding:14px 10px 12px;gap:10px}
    .tanzaku-main{font-size:22px}
    .hints{display:none}
    .dock{bottom:14px;gap:7px;padding:8px 10px;max-width:calc(100vw - 20px)}
    input[type=range]{width:92px}
    .dock output{min-width:58px}
    .btn{padding:8px 12px}
  }
  @media (prefers-reduced-motion:reduce){
    .veil .mark{animation:none}
    .btn.bell.pinged{animation:none}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="tanzaku" aria-hidden="true">
  <div class="tanzaku-main">醍醐骑行</div>
  <div class="tanzaku-sub">花见之路</div>
  <div class="seal">醍</div>
</div>

<div class="hints">拖动旋转 · 滚轮缩放 · <b>V</b> 切换视角 · <b>空格</b> 按铃</div>

<div class="dock" role="toolbar" aria-label="骑行控制台">
  <div class="speedbox">
    <label for="speed">速度</label>
    <input id="speed" type="range" min="0" max="30" step="1" value="14" aria-label="骑行速度">
    <output id="speedVal">14 km/h</output>
  </div>
  <div class="divider"></div>
  <button class="btn bell" id="bell">🔔 按铃</button>
  <button class="btn" id="viewBtn">自由视角</button>
</div>

<div class="veil" id="veil">
  <div class="mark">醍</div>
  <p>醍醐 · 启程中</p>
  <small>DAIGO HANAMI RIDE</small>
</div>

<div class="nogl" id="nogl">你的浏览器不支持 WebGL<br>换个现代浏览器再来看看醍醐吧</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 调色板 ================= */
const C = {
  skyTop:  0x2c3562,
  skyMid:  0x96638f,
  horizon: 0xf2a07c,
  fog:     0xefa186,
  sunCol:  0xffdca6,
  ink:     0x3a3148,
  seal:    0xb5484d,
  cream:   0xf6efe4,
  petal:   0xf7b9c9,
  grass:   0x5c6553,
  road:    0x453f4e,
  hair:    0x4a3728,
  skin:    0xffe0c2,
  tire:    0x2e2a33,
  metal:   0xd9cfc0,
  rattan:  0x8a6b4f,
};

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 基础 ================= */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('nogl').style.display = 'flex';
  document.getElementById('veil').classList.add('off');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.fog, 26, 105);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(3.4, 1.9, 4.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, -2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.2;
controls.maxDistance = 20;
controls.maxPolarAngle = 1.54;
controls.enabled = false; // 初始为跟随视角

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0xffb7c9, 0x544964, 1.15));
const sunDirV = new THREE.Vector3(-0.38, 0.18, -0.9).normalize();
const sun = new THREE.DirectionalLight(0xffb36b, 1.7);
sun.position.copy(sunDirV).multiplyScalar(46);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;   sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 20;  sun.shadow.camera.far = 100;
sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff8fa8, 0.5);
rim.position.set(6, 5, 8);
scene.add(rim);

/* ================= 天空 ================= */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(190, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top:    { value: new THREE.Color(C.skyTop) },
      mid:    { value: new THREE.Color(C.skyMid) },
      bot:    { value: new THREE.Color(C.horizon) },
      sunDir: { value: sunDirV },
      sunCol: { value: new THREE.Color(C.sunCol) },
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 top,mid,bot,sunDir,sunCol;
      varying vec3 vDir;
      void main(){
        float h = clamp(vDir.y,-.1,1.0);
        vec3 col = mix(bot, mid, smoothstep(0.0,0.22,h));
        col = mix(col, top, smoothstep(0.2,0.75,h));
        float d = max(dot(vDir,sunDir),0.0);
        col += sunCol * (pow(d,900.0)*1.6 + pow(d,26.0)*0.42 + pow(d,5.0)*0.10);
        gl_FragColor = vec4(col,1.0);
      }`,
  })
);
scene.add(sky);

/* 暮色星子 */
{
  const n = 130, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = 150 + Math.random() * 30;
    const y = 55 + Math.random() * 100;
    pos.set([Math.cos(a) * r, y, Math.sin(a) * r], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xfff4e0, size: 0.7, sizeAttenuation: true,
    transparent: true, opacity: 0.75, fog: false,
  })));
}

/* ================= 大地 / 道路 ================= */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(160, 48),
  new THREE.MeshLambertMaterial({ color: C.grass })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function roadTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#453f4e'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) { // 沥青颗粒
    g.fillStyle = `rgba(${180 + Math.random() * 40 | 0},${170 + Math.random() * 40 | 0},${185 + Math.random() * 40 | 0},${0.03 + Math.random() * 0.05})`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  g.fillStyle = 'rgba(24,20,30,.28)'; // 车辙微暗
  g.fillRect(70, 0, 14, 256); g.fillRect(172, 0, 14, 256);
  g.fillStyle = '#e9c496'; // 中央虚线
  g.fillRect(124, 8, 8, 108);
  g.fillStyle = 'rgba(246,239,228,.5)'; // 边线
  g.fillRect(6, 0, 3, 256); g.fillRect(247, 0, 3, 256);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 44);
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ROAD_LEN = 360, ROAD_SEG = ROAD_LEN / 44;
const roadTex = roadTexture();
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, ROAD_LEN),
  new THREE.MeshLambertMaterial({ map: roadTex })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.012;
road.receiveShadow = true;
scene.add(road);

/* ================= 材质库 ================= */
const M = {
  ink:    new THREE.MeshStandardMaterial({ color: C.ink, roughness: .85 }),
  seal:   new THREE.MeshStandardMaterial({ color: C.seal, roughness: .6 }),
  cream:  new THREE.MeshStandardMaterial({ color: C.cream, roughness: .8 }),
  metal:  new THREE.MeshStandardMaterial({ color: C.metal, roughness: .35, metalness: .55 }),
  tire:   new THREE.MeshStandardMaterial({ color: C.tire, roughness: .95 }),
  rattan: new THREE.MeshStandardMaterial({ color: C.rattan, roughness: .9 }),
  skin:   new THREE.MeshStandardMaterial({ color: C.skin, roughness: .7 }),
  hair:   new THREE.MeshStandardMaterial({ color: C.hair, roughness: .85 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x241f2c, roughness: .8 }),
  blossom:[0xf7b6c8, 0xf2a3bb, 0xfbdde7].map(c =>
    new THREE.MeshStandardMaterial({ color: c, roughness: .9, emissive: c, emissiveIntensity: .2 })),
  trunk:  new THREE.MeshStandardMaterial({ color: 0x4a3b35, roughness: 1 }),
  cloud:  new THREE.MeshLambertMaterial({ color: 0xffd9e0, emissive: 0xcf8f9e, emissiveIntensity: .18 }),
  mount:  new THREE.MeshLambertMaterial({ color: 0x6b5678 }),
  pagoda: new THREE.MeshLambertMaterial({ color: 0x453a58 }),
  pagodaR:new THREE.MeshLambertMaterial({ color: 0x38304c }),
};

/* 几何工具：两点之间放一根圆柱 */
const UP = new THREE.Vector3(0, 1, 0);
function tube(a, b, r, mat, seg = 10) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.clone().normalize());
  m.castShadow = true;
  return m;
}

/* ================= 自行车 + 醍醐 ================= */
const bike = new THREE.Group();
scene.add(bike);

const WHEEL_R = 0.34;
const FRONT_Z = 0.52, REAR_Z = -0.52;   // 车头朝 -Z
const BB = new THREE.Vector3(0, 0.42, 0.06); // 五通
const SEAT_TOP = new THREE.Vector3(0, 0.98, -0.12);
const HEAD_TOP = new THREE.Vector3(0, 0.98, 0.42);

function buildWheel() {
  const w = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R, 0.034, 12, 40), M.tire);
  tire.rotation.y = Math.PI / 2; tire.castShadow = true;
  w.add(tire);
  const rimM = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.045, 0.012, 8, 32), M.metal);
  rimM.rotation.y = Math.PI / 2; w.add(rimM);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.09, 12), M.metal);
  hub.rotation.z = Math.PI / 2; w.add(hub);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    const s = tube(
      new THREE.Vector3(0, Math.sin(a) * 0.04, Math.cos(a) * 0.04),
      new THREE.Vector3(0, Math.sin(a) * (WHEEL_R - 0.05), Math.cos(a) * (WHEEL_R - 0.05)),
      0.0035, M.metal, 5
    );
    s.castShadow = false;
    w.add(s);
  }
  // 挡泥板
  const fender = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R + 0.035, 0.022, 8, 24, 2.1), M.cream);
  fender.rotation.y = Math.PI / 2;
  fender.rotation.x = Math.PI / 2 - 1.05 + Math.PI; // 罩住上后方
  fender.castShadow = true;
  w.add(fender);
  return w;
}
const wheelF = buildWheel(); wheelF.position.set(0, WHEEL_R, FRONT_Z); bike.add(wheelF);
const wheelR = buildWheel(); wheelR.position.set(0, WHEEL_R, REAR_Z);  bike.add(wheelR);

/* 车架 */
{
  const r = 0.022;
  const headBot = new THREE.Vector3(0, 0.52, 0.47);
  bike.add(tube(headBot, HEAD_TOP, r * 1.15, M.seal));                    // 头管
  bike.add(tube(BB, headBot, r, M.seal));                                  // 下管
  bike.add(tube(BB, new THREE.Vector3(0, 0.86, -0.10), r, M.seal));        // 座管
  bike.add(tube(new THREE.Vector3(0, 0.86, -0.10), HEAD_TOP, r, M.seal));  // 上管
  bike.add(tube(BB, new THREE.Vector3(0, WHEEL_R, REAR_Z), r * 0.8, M.seal)); // 后下叉
  bike.add(tube(new THREE.Vector3(0, 0.86, -0.10), new THREE.Vector3(0, WHEEL_R, REAR_Z), r * 0.8, M.seal)); // 后上叉
  // 后货架
  const rackY = new THREE.Vector3(0, 0.68, REAR_Z - 0.02);
  bike.add(tube(new THREE.Vector3(0, 0.62, REAR_Z + 0.12), rackY, 0.012, M.metal));
  bike.add(tube(rackY, new THREE.Vector3(0, 0.86, -0.10), 0.012, M.metal));
  const plank = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, 0.3), M.ink);
  plank.position.set(0, 0.7, REAR_Z); plank.castShadow = true; bike.add(plank);
  // 车座
  const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.045, 0.24), M.ink);
  saddle.position.copy(SEAT_TOP); saddle.rotation.x = -0.08;
  saddle.castShadow = true; bike.add(saddle);
}

/* 前叉总成（转向） */
const steer = new THREE.Group();
steer.position.set(0, 0, 0);
bike.add(steer);
{
  const headBot = new THREE.Vector3(0, 0.52, 0.47);
  steer.add(tube(HEAD_TOP, new THREE.Vector3(0, WHEEL_R, FRONT_Z), 0.018, M.metal)); // 前叉左
  steer.add(tube(new THREE.Vector3(0.05, HEAD_TOP.y, HEAD_TOP.z), new THREE.Vector3(0.05, WHEEL_R, FRONT_Z), 0.018, M.metal));
  steer.add(tube(new THREE.Vector3(-0.05, HEAD_TOP.y, HEAD_TOP.z), new THREE.Vector3(-0.05, WHEEL_R, FRONT_Z), 0.018, M.metal));
  // 车把
  const barY = HEAD_TOP.y + 0.04;
  steer.add(tube(new THREE.Vector3(0, barY - 0.05, HEAD_TOP.z), new THREE.Vector3(0, barY, HEAD_TOP.z - 0.02), 0.017, M.metal));
  const hbar = tube(new THREE.Vector3(-0.21, barY, HEAD_TOP.z - 0.02), new THREE.Vector3(0.21, barY, HEAD_TOP.z - 0.02), 0.015, M.metal);
  steer.add(hbar);
  steer.add(tube(new THREE.Vector3(-0.21, barY, HEAD_TOP.z - 0.02), new THREE.Vector3(-0.24, barY + 0.03, HEAD_TOP.z - 0.02), 0.02, M.ink));
  steer.add(tube(new THREE.Vector3(0.21, barY, HEAD_TOP.z - 0.02), new THREE.Vector3(0.24, barY + 0.03, HEAD_TOP.z - 0.02), 0.02, M.ink));
  const gripL = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.09, 10), M.ink);

let audioCtx = null;
function ringBell() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [[0, 2093], [0.14, 2093]].forEach(([dt, f]) => {
      [1, 2.52, 3.98].forEach((h, i) => {
        const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f * h;
        gn.gain.setValueAtTime(0.0001, t0 + dt);
        gn.gain.exponentialRampToValueAtTime(0.22 / (i + 1), t0 + dt + 0.012);
        gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.55);
        o.connect(gn).connect(audioCtx.destination);
        o.start(t0 + dt); o.stop(t0 + dt + 0.6);
      });
    });
  } catch (e) { /* 无声环境忽略 */ }
}

function solveLeg(sx, theta) {
  const st = legState[sx];
  const pedal = tmpA.set(
    st.hip.x + sx * 0.045,
    BB.y + Math.cos(theta) * CRANK_R,
    BB.z + Math.sin(theta) * CRANK_R
  );
  const dir = tmpB.subVectors(pedal, st.hip);
  let d = dir.length();
  const maxD = L1 + L2 - 0.02;
  if (d > maxD) { dir.multiplyScalar(maxD / d); d = maxD; }
  dir.normalize();
  const a = Math.acos(Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
  // 膝盖朝前（-Z）
  const n = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(1, 0, 0)).normalize();
  const knee = new THREE.Vector3().copy(st.hip)
    .addScaledVector(dir, Math.cos(a) * L1)
    .addScaledVector(n, -Math.sin(a) * L1);
  st.thigh.geometry.dispose();
  st.thigh.geometry = new THREE.CylinderGeometry(0.05, 0.048, st.hip.distanceTo(knee), 8);
  st.thigh.position.copy(st.hip).lerp(knee, 0.5);
  st.thigh.quaternion.setFromUnitVectors(UP, knee.clone().sub(st.hip).normalize());
  st.shin.geometry.dispose();
  st.shin.geometry = new THREE.CylinderGeometry(0.042, 0.036, knee.distanceTo(pedal), 8);
  st.shin.position.copy(knee).lerp(pedal, 0.5);
  st.shin.quaternion.setFromUnitVectors(UP, pedal.clone().sub(knee).normalize());
  st.shoe.position.set(pedal.x, pedal.y + 0.035, pedal.z + 0.01);
  st.shoe.rotation.set(0, Math.PI, 0);
  pedalL.position.set(pedal.x, pedal.y, pedal.z); // sx=-1 → pedalL
  return pedal;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 速度平滑
  speed += (speedTarget - speed) * Math.min(1, dt * 2.2);
  const moving = speed > 0.15;

  // 车轮 / 曲柄
  const w = speed / WHEEL_R;
  wheelA -= w * dt;                    // 前进方向 -Z → 顶部向后转
  wheelF.rotation.x = wheelA;
  wheelR.rotation.x = wheelA;
  const cadence = w / 2.6;
  crankA += cadence * dt;
  crank.rotation.x = crankA;

  // 双腿踩踏（左右相位差 π）
  const thL = crankA, thR = crankA + Math.PI;
  const pL = solveLeg(-1, thL);
  const pR = solveLeg(1, thR);
  pedalR.position.set(pR.x, pR.y, pR.z);

  // 车身起伏 / 转把
  const bobA = reduced ? 0.004 : 0.014;
  bike.position.y = moving ? Math.sin(crankA * 2) * bobA : 0;
  bike.rotation.z = moving ? Math.sin(crankA) * 0.008 : 0;
  steer.rotation.y = moving ? Math.sin(t * 0.7) * 0.05 : 0;

  // 骑手活气：头部点头、围巾飘
  const head = rider.userData.head;
  head.rotation.x = moving ? Math.sin(crankA * 2) * 0.045 : Math.sin(t * 1.2) * 0.03;
  head.rotation.z = Math.sin(t * 0.8) * 0.03;
  const tail = rider.userData.scarfTail;
  tail.rotation.x = Math.sin(t * 3.2) * 0.12 - 0.1;
  tail.rotation.z = Math.cos(t * 2.6) * 0.08;

  // 幡旗波动（顶点级）
  const fp = flagGeo.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    const y = fp.getY(i);
    const x = fp.getX(i);
    fp.setZ(i, Math.sin(y * 9 + t * 7 + x * 4) * 0.016 * (1 - (y + 0.31) / 0.62));
  }
  fp.needsUpdate = true;

  // 景物循环
  const dz = speed * dt;
  for (const d of drift) {
    d.obj.position.z += dz * d.f;
    if (d.obj.position.z > 14) d.obj.position.z -= d.loopLen;
  }
  roadTex.offset.y += dz / ROAD_SEG;

  // 云
  clouds.children.forEach((c, i) => {
    c.position.x += dt * (0.3 + i * 0.06);
    if (c.position.x > 100) c.position.x = -100;
  });

  // 落樱
  for (let i = 0; i < PETAL_N; i++) {
    const p = petals[i];
    p.y -= p.fall * dt;
    p.sway += p.swaySp * dt;
    p.x += Math.sin(p.sway) * dt * 0.7;
    p.z += dz * 0.65 + dt * 0.25;
    if (p.y < 0.02) { p.y = 7 + Math.random() * 3; p.x = (Math.random() - .5) * 30; }
    if (p.z > 12) { p.z -= 88; p.x = (Math.random() - .5) * 30; }
    p.rot.x += p.rotSp * dt; p.rot.y += p.rotSp * 1.3 * dt;
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.copy(p.rot);
    dummy.scale.setScalar(p.sc);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  // 相机
  if (viewMode === 'follow') {
    camAngle += dt * (reduced ? 0 : 0.045);
    const ang = 0.42 + Math.sin(camAngle) * 0.18;
    const radius = 5.6 + speed * 0.06;
    tmpA.set(Math.sin(ang) * radius, 1.75 + Math.sin(t * 0.3) * 0.15, Math.cos(ang) * radius * 0.92);
    camera.position.lerp(tmpA, Math.min(1, dt * 2.5));
    tmpB.set(0, 1.02, -2.5);
    lookTarget.lerp(tmpB, Math.min(1, dt * 2));
    camera.lookAt(lookTarget);
  } else {
    controls.update();
  }

  renderer.render(scene, camera);

  if (!started) {
    started = true;
    setTimeout(() => document.getElementById('veil').classList.add('off'), 350);
  }
}
animate();
</script>
</body>
</html>
